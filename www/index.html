  <head>

    <title>Document</title>
    <style>
      .content-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: grid;
        place-content: center;
        place-items: center;
      }

      header {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      label { font-weight: bold; }
    </style>
  </head>

    <div class="content-wrapper">
      <header>

        <label>状态：</label>
        <span></span>
      </header>
      <canvas id="snake-canvas"></canvas>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
